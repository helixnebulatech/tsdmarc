# Weekly dependency updates, grouped, with a 3-day cooldown (as in vercel/ai).
version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
      - /tools/*
    schedule:
      interval: weekly
      day: friday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']
