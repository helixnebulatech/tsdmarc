# Modelled on vercel/ai's CI: build once, reuse dist/ in every test job, and
# a final "all required jobs passed" gate for branch protection.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Dispatched by the release workflow for the "Version Packages" PR, whose
  # commits (made with GITHUB_TOKEN) don't trigger workflows.
  workflow_dispatch:

permissions:
  contents: read

env:
  TSRS_VERSION: 0.18.0-ts7.1.0-dev.20260929

jobs:
  check:
    name: 'Lint & Format'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Run ultracite check
        run: pnpm run check

  build-packages:
    name: 'Build Packages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build packages
        run: pnpm run build:packages

      - name: Check packaging (publint + attw)
        run: pnpm run publint

      - name: Check package tarballs (LICENSE, NOTICE, entry points)
        run: pnpm run pack:check

      - name: Archive package build artifacts
        run: tar -czf package-build-artifacts.tgz packages/*/dist

      - name: Upload package build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-build-artifacts
          path: package-build-artifacts.tgz

  types:
    name: 'TypeScript'
    runs-on: ubuntu-latest
    needs: build-packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install tsrs
        run: bun add -g "tsrs@${TSRS_VERSION}"

      - name: Download package build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-build-artifacts

      - name: Extract package build artifacts
        run: tar -xzf package-build-artifacts.tgz

      - name: Run tsrs type check
        run: pnpm run type-check

  test_node_versions:
    name: 'Test Node Versions'
    runs-on: ubuntu-latest
    outputs:
      node_versions: ${{ steps.node-versions.outputs.node_versions }}
    steps:
      # On a PR, HEAD is the merge commit and HEAD^1 the base branch. Fetching
      # them here avoids a later `git fetch`, which has no credentials in a
      # private repo.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select Node versions
        id: node-versions
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo 'node_versions=[24,26]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Not piped directly: a git failure must fail the step, not select
          # fewer Node versions.
          changed_files="$(git diff --name-only HEAD^1 HEAD)"

          if printf '%s\n' "$changed_files" | grep -E '^packages/[^/]+/(src/|resources/|.*\.test\.ts$)|^fixtures/|^samples/'; then
            echo 'node_versions=[24,26]' >> "$GITHUB_OUTPUT"
          else
            echo 'node_versions=[24]' >> "$GITHUB_OUTPUT"
          fi

  test_matrix:
    name: 'Test (Node ${{ matrix.node-version }})'
    runs-on: ubuntu-latest
    needs: [build-packages, test_node_versions]
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.test_node_versions.outputs.node_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true

      - name: Download package build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-build-artifacts

      - name: Extract package build artifacts
        run: tar -xzf package-build-artifacts.tgz

      - name: Run tests
        env:
          # Test results must not be reused across the Node version matrix.
          TEST_NODE_VERSION: ${{ matrix.node-version }}
        run: pnpm test

  smoke:
    name: 'Smoke (${{ matrix.runtime }})'
    runs-on: ubuntu-latest
    needs: build-packages
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Download package build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-build-artifacts

      - name: Extract package build artifacts
        run: tar -xzf package-build-artifacts.tgz

      - name: Run smoke tests
        run: node tools/smoke/run.mjs --runtime ${{ matrix.runtime }}

  test:
    name: 'All required jobs passed'
    runs-on: ubuntu-latest
    needs:
      [check, build-packages, types, test_node_versions, test_matrix, smoke]
    if: ${{ !cancelled() }}
    steps:
      - name: All required jobs passed
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: exit 0
      - name: Some required job failed or was skipped
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
