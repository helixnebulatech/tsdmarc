# Builds the documentation website (apps/docs, Astro Starlight) and deploys
# it to GitHub Pages. The API reference is generated from the package
# sources, so changes to them redeploy the site too.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".
name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# One deployment at a time; a newer run waits instead of cancelling one that
# is already deploying.
concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: 'Build docs'
    runs-on: ubuntu-latest
    # do not attempt running in forks
    if: ${{ !github.event.repository.fork }}
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Builds the workspace packages first (turbo `^build`), then the site.
      - name: Build docs
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm turbo run build --filter=@tsdmarc/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: 'Deploy to GitHub Pages'
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !github.event.repository.fork }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
