# Example tsdmarc configuration (same format as parsedmarc's).
#
#   tsdmarc -c config.ini
#
# Booleans accept True/False, yes/no, on/off and 1/0. Any key can also be set
# with an environment variable named TSDMARC_{SECTION}_{KEY}, which wins over
# this file. Keep secrets there instead of here, for example:
#
#   export TSDMARC_IMAP_PASSWORD='...'
#   # or, with Docker/Kubernetes secrets:
#   export TSDMARC_IMAP_PASSWORD_FILE=/run/secrets/imap_password

[general]
save_aggregate = True
save_failure = True
save_smtp_tls = True
# Also write JSON and CSV files to this directory.
output = /var/lib/tsdmarc/output
# Print warnings in addition to errors (a config file implies --silent).
warnings = True

[mailbox]
reports_folder = INBOX
archive_folder = Archive
# Keep running and process new messages as they arrive (IMAP IDLE).
# Send SIGHUP to reload this file without restarting.
watch = True

[imap]
host = imap.example.com
user = dmarc-reports@example.com
# password is required: set TSDMARC_IMAP_PASSWORD (or
# TSDMARC_IMAP_PASSWORD_FILE) instead of writing it here.
# password = ...

# Elasticsearch 9 (@tsdmarc/elasticsearch).
# [elasticsearch]
# hosts = 127.0.0.1:9200
# ssl = False

# Splunk HTTP Event Collector.
# [splunk_hec]
# url = https://splunkhec.example.com
# token = HECTokenGoesHere
# index = email

# Amazon S3 or a compatible service (@tsdmarc/s3). Without access_key_id and
# secret_access_key, credentials come from the default AWS provider chain.
# [s3]
# bucket = my-bucket
# path = tsdmarc

# Gmail API instead of [imap] (@tsdmarc/gmail).
# [gmail_api]
# credentials_file = /etc/example/credentials.json
# token_file = /etc/example/token.json
# include_spam_trash = True
# paginate_messages = True
# scopes = https://www.googleapis.com/auth/gmail.modify
