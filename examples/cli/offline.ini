# Parse report files without any network access.
#
#   node packages/cli/dist/bin.js -c examples/cli/offline.ini samples/aggregate/*.xml
#
# Relative paths (like `output`) are resolved from the current directory.

[general]
# No DNS queries and no downloads: GeoIP uses the IPinfo Lite database from
# @tsdmarc/ipinfo-lite, and the reverse DNS map and PSL overrides use the
# files bundled with tsdmarc.
offline = True
save_aggregate = True
save_failure = True
save_smtp_tls = True
# Writes aggregate.json/.csv, failure.json/.csv and smtp_tls.json/.csv here.
output = output
# A config file implies --silent; print warnings too.
warnings = True
